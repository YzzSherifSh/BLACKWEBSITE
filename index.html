<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Saya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #38bdf8;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #0f172a;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #f8fafc;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: block;
            text-align: center;
            padding: 12px 16px;
            background-color: #334155;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .link-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">FA</div>
        <h1>Fulan Ahmad</h1>
        <p>Pengembang web dan pembuat konten digital. Suka bereksperimen dengan desain minimalis dan antarmuka yang ramah pengguna.</p>
        
        <div class="links">
            <a href="#" class="link-btn">Proyek Terbaru</a>
            <a href="#" class="link-btn">Kontak Saya</a>
        </div>
    </div>

</body>
</html>
