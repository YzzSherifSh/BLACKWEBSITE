<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://backboard.railway.com https://*; img-src 'self' data:;">
    <title>Buku Kas & Cloud Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            font-size: 13.5px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            user-select: none;
            -webkit-user-select: none;
        }
        input, select, textarea, code {
            user-select: text;
            -webkit-user-select: text;
        }
        a, button { font-family: inherit; }

        /* Skeleton Loading */
        @keyframes skPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .sk-block { background-color: #e5e5e5; animation: skPulse 1.1s ease-in-out infinite; }
        .sk-wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px; }
        .sk-nav { height: 52px; border-bottom: 1px solid #d4d4d4; background: #fafafa; display: flex; align-items: center; padding: 0 20px; }
        .sk-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid #d4d4d4; margin-bottom: 24px; }
        .sk-cell { padding: 18px 16px; border-right: 1px solid #d4d4d4; }
        .sk-cell:last-child { border-right: none; }
        .sk-cols { display: grid; grid-template-columns: 320px 1fr; gap: 28px; }

        /* Navigasi Atas */
        .top-bar { border-bottom: 1px solid #d4d4d4; background: #fafafa; position: sticky; top: 0; z-index: 20; }
        .top-inner {
            max-width: 1180px; margin: 0 auto; padding: 11px 20px;
            display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
        }
        .site-title { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
        .site-sub { font-size: 11.5px; color: #525252; font-variant-numeric: tabular-nums; }
        .nav-links { display: flex; gap: 18px; flex-wrap: wrap; }
        .nav-btn {
            background: none; border: none; font-size: 13px; color: #525252;
            padding: 4px 0; border-bottom: 2px solid transparent; cursor: pointer;
        }
        .nav-btn:hover { color: #111111; }
        .nav-btn.active { color: #111111; font-weight: 600; border-bottom-color: #111111; }
        .top-actions { display: flex; gap: 12px; align-items: center; }

        .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px 20px; }

        /* Notifikasi & Alert */
        .flash {
            border: 1px solid #111111; background: #fafafa;
            padding: 9px 14px; margin-bottom: 20px; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .flash-err { border-color: #7f1d1d; background: #fef2f2; color: #7f1d1d; }
        .warn-integrity {
            border: 1px solid #7f1d1d; background: #fef2f2; color: #7f1d1d;
            padding: 10px 14px; margin-bottom: 20px; font-size: 13px; font-weight: 600;
        }

        /* Ringkasan 4 Kolom */
        .summary-strip {
            display: grid; grid-template-columns: repeat(4, 1fr);
            border: 1px solid #111111; margin-bottom: 26px; background: #ffffff;
        }
        .summary-cell { padding: 14px 16px; border-right: 1px solid #d4d4d4; }
        .summary-cell:last-child { border-right: none; }
        .summary-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: #525252; margin-bottom: 4px; font-weight: 600; }
        .summary-num { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.3px; }
        .summary-sub { font-size: 11.5px; color: #525252; margin-top: 4px; }

        /* Grid Utama */
        .cols { display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: start; }
        .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }

        .sec-title {
            font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
            padding-bottom: 8px; margin-bottom: 14px; border-bottom: 1px solid #111111;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Form & Input */
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; color: #404040; margin-bottom: 4px; font-weight: 500; }
        input[type="text"], input[type="password"], input[type="date"], input[type="time"], input[type="month"], input[type="number"], select {
            width: 100%; padding: 7px 9px; border: 1px solid #a3a3a3;
            background: #ffffff; color: #111111; font-size: 13.5px; font-family: inherit; border-radius: 0;
        }
        input:focus, select:focus { outline: none; border-color: #111111; }

        .radio-row { display: flex; gap: 16px; padding: 4px 0; }
        .radio-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #111111; cursor: pointer; margin: 0; font-weight: 400; }

        .btn {
            display: inline-block; padding: 8px 14px; font-size: 13px; font-weight: 500;
            background: #111111; color: #ffffff; border: 1px solid #111111;
            cursor: pointer; text-align: center; border-radius: 0;
        }
        .btn:hover { background: #262626; }
        .btn:disabled { background: #a3a3a3; border-color: #a3a3a3; cursor: not-allowed; }
        .btn-sec { background: #ffffff; color: #111111; border: 1px solid #a3a3a3; }
        .btn-sec:hover { border-color: #111111; background: #fafafa; }
        .btn-full { width: 100%; }
        .btn-xs { padding: 5px 10px; font-size: 12px; }
        .btn-link { background: none; border: none; color: #737373; font-size: 12px; cursor: pointer; padding: 0; }
        .btn-link:hover { color: #111111; text-decoration: underline; }

        .box-panel { border: 1px solid #d4d4d4; padding: 16px; background: #fafafa; }
        .box-solid { border: 1px solid #111111; padding: 16px; background: #ffffff; }

        /* Filter & Tabel */
        .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .filters select, .filters input { width: auto; min-width: 120px; padding: 5px 8px; font-size: 12.5px; }

        .tbl-scroll { overflow-x: auto; border-top: 1px solid #111111; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 9px 8px; border-bottom: 1px solid #e5e5e5; text-align: left; vertical-align: top; }
        th { font-size: 11px; text-transform: uppercase; color: #525252; font-weight: 600; border-bottom: 1px solid #a3a3a3; background: #fafafa; }
        tr:hover td { background: #fafafa; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
        .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .val-in { color: #14532d; }
        .val-out { color: #7f1d1d; }

        .track { width: 100%; height: 4px; background: #e5e5e5; margin: 6px 0; }
        .fill { height: 100%; background: #111111; }

        .acc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .acc-item { border: 1px solid #d4d4d4; padding: 16px; background: #ffffff; }

        .badge {
            display: inline-block; padding: 1px 6px; font-size: 10.5px; font-weight: 600;
            border: 1px solid #a3a3a3; background: #fafafa; color: #111111;
        }

        @media (max-width: 920px) {
            .summary-strip, .sk-strip { grid-template-columns: repeat(2, 1fr); }
            .summary-cell:nth-child(2), .sk-cell:nth-child(2) { border-right: none; }
            .summary-cell:nth-child(1), .summary-cell:nth-child(2),
            .sk-cell:nth-child(1), .sk-cell:nth-child(2) { border-bottom: 1px solid #d4d4d4; }
            .cols, .sk-cols, .cols-2 { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 520px) {
            .summary-strip, .sk-strip { grid-template-columns: 1fr; }
            .summary-cell, .sk-cell { border-right: none; border-bottom: 1px solid #d4d4d4; }
            .summary-cell:last-child, .sk-cell:last-child { border-bottom: none; }
        }
    </style>
</head>

<script>
(function () {
    "use strict";

    // =========================================================================
    // 1. PROTEKSI ANTARMUKA & INTEGRITAS KRIPTOGRAFI LOCALSTORAGE (AES-256-GCM)
    // =========================================================================
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && ["I", "J", "C", "K"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && ["U", "S"].includes(e.key.toUpperCase())) ||
            (e.metaKey && e.altKey && ["I", "J", "U"].includes(e.key.toUpperCase()))
        ) {
            e.preventDefault();
            return false;
        }
    });

    const STORAGE_KEY = "vault_ledger_ghpages_v6";
    const MASTER_KEY_STORAGE = "vault_ledger_mk_v6";

    let STATE = null;
    let MASTER_KEY_BIN = null;
    let CURRENT_VIEW = "ledger";
    let FLASH_MSG = null; // { text, isErr }
    let FILTER = { acc: 0, type: "all", month: "", q: "" };

    function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes;
    }

    function bytesToHex(bytes) {
        return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function bytesToB64(bytes) {
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }

    function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    async function ensureMasterKey() {
        let hex = localStorage.getItem(MASTER_KEY_STORAGE);
        if (!hex || hex.length !== 64) {
            const rnd = crypto.getRandomValues(new Uint8Array(32));
            hex = bytesToHex(rnd);
            localStorage.setItem(MASTER_KEY_STORAGE, hex);
        }
        MASTER_KEY_BIN = hexToBytes(hex);
    }

    async function sealSecret(plaintext) {
        if (!plaintext) return "";
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await crypto.subtle.importKey("raw", MASTER_KEY_BIN, { name: "AES-GCM" }, false, ["encrypt"]);
        const enc = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plaintext));
        const combined = new Uint8Array(iv.length + enc.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(enc), iv.length);
        return bytesToB64(combined);
    }

    async function unsealSecret(b64) {
        if (!b64) return "";
        try {
            const raw = b64ToBytes(b64);
            if (raw.length < 28) return "";
            const iv = raw.slice(0, 12);
            const data = raw.slice(12);
            const key = await crypto.subtle.importKey("raw", MASTER_KEY_BIN, { name: "AES-GCM" }, false, ["decrypt"]);
            const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
            return new TextDecoder().decode(dec);
        } catch (e) {
            return "";
        }
    }

    async function hmacSha256(message) {
        const key = await crypto.subtle.importKey(
            "raw", MASTER_KEY_BIN, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
        );
        const sig = await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(message));
        return bytesToHex(new Uint8Array(sig));
    }

    function maskSecret(str) {
        if (!str) return "Belum diatur";
        if (str.length <= 8) return "*".repeat(str.length);
        return str.slice(0, 4) + "*".repeat(Math.min(14, str.length - 8)) + str.slice(-4);
    }

    // =========================================================================
    // 2. INISIALISASI & PERSISTENSI LOCALSTORAGE
    // =========================================================================
    function getNowParts(tz) {
        const now = new Date();
        try {
            const fmtDate = new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" });
            const fmtTime = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
            return { date: fmtDate.format(now), time: fmtTime.format(now) };
        } catch (e) {
            return {
                date: now.toISOString().slice(0, 10),
                time: now.toTimeString().slice(0, 5)
            };
        }
    }

    function addDaysStr(daysOffset) {
        const d = new Date(Date.now() + daysOffset * 86400000);
        return d.toISOString().slice(0, 10);
    }

    async function signEntryObj(e) {
        const raw = [e.account_id, e.ref, e.type, e.category, e.amount, e.note, e.entry_date, e.entry_time].join("|");
        return await hmacSha256(raw);
    }

    async function writeAudit(code, detail) {
        const prevHash = STATE.audit_logs.length > 0
            ? STATE.audit_logs[STATE.audit_logs.length - 1].chain_hash
            : "0".repeat(64);
        const np = getNowParts(STATE.meta.timezone);
        const ts = np.date + " " + np.time + ":00";
        const chainHash = await hmacSha256([prevHash, ts, "LOCAL-BROWSER", code, detail].join("|"));
        STATE.audit_logs.push({
            id: (STATE.audit_logs.reduce((m, x) => Math.max(m, x.id), 0)) + 1,
            event_time: ts,
            ip_addr: "LOCAL-CLIENT",
            action_code: code,
            detail: detail,
            chain_hash: chainHash
        });
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    }

    async function initDefaultState() {
        STATE = {
            meta: {
                title: "Buku Kas & Cloud Manager",
                timezone: "Asia/Jakarta",
                payday_day: 25,
                payday_label: "Hari Gajian Bulanan",
                payday_amount: 0
            },
            accounts: [
                { id: 1, code: "ACC-01", name: "Simpanan Utama", goal: 5000000, deadline: addDaysStr(180) },
                { id: 2, code: "ACC-02", name: "Dana Cadangan", goal: 2500000, deadline: addDaysStr(90) }
            ],
            entries: [],
            cloud_profiles: [],
            cloud_deployments: [],
            audit_logs: []
        };

        const seeds = [
            { id: 1, account_id: 1, ref: "0001", type: "in", category: "Gaji / Penghasilan", amount: 1500000, note: "Alokasi gaji bulanan", entry_date: addDaysStr(-10), entry_time: "09:15" },
            { id: 2, account_id: 1, ref: "0002", type: "in", category: "Setoran", amount: 250000, note: "Setoran tambahan pekan ini", entry_date: addDaysStr(-5), entry_time: "14:30" },
            { id: 3, account_id: 2, ref: "0003", type: "in", category: "Alokasi", amount: 500000, note: "Sisihan dana cadangan", entry_date: addDaysStr(-3), entry_time: "19:05" },
            { id: 4, account_id: 1, ref: "0004", type: "out", category: "Penarikan", amount: 180000, note: "Kebutuhan operasional harian", entry_date: addDaysStr(-1), entry_time: "16:40" }
        ];

        for (const s of seeds) {
            s.integrity_sig = await signEntryObj(s);
            STATE.entries.push(s);
        }
        await writeAudit("SYS_INIT", "Inisialisasi penyimpanan terenkripsi localStorage");
        saveState();
    }

    async function loadState() {
        await ensureMasterKey();
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
            await initDefaultState();
            return;
        }
        try {
            const parsed = JSON.parse(raw);
            if (!parsed || !parsed.meta || !Array.isArray(parsed.accounts)) {
                await initDefaultState();
            } else {
                STATE = parsed;
            }
        } catch (e) {
            await initDefaultState();
        }
    }

    // =========================================================================
    // 3. API CLIENT LANGSUNG DARI BROWSER (RAILWAY GRAPHQL & PTERODACTYL)
    // =========================================================================
    async function deployRailwayVps(token, projectId, envId, serviceName, dockerImage, rootPass) {
        const endpoint = "https://backboard.railway.com/graphql/v2";
        const headers = {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        };

        try {
            const meResp = await fetch(endpoint, {
                method: "POST",
                headers,
                body: JSON.stringify({ query: "query { me { id email name } }" })
            });
            const meData = await meResp.json();
            if (!meResp.ok || !meData?.data?.me?.id) {
                const err = meData?.errors?.[0]?.message || ("HTTP " + meResp.status);
                return { ok: false, err: "Token Railway tidak valid: " + err };
            }

            if (!projectId) {
                const projResp = await fetch(endpoint, {
                    method: "POST",
                    headers,
                    body: JSON.stringify({
                        query: "mutation($name: String!) { projectCreate(input: { name: $name }) { id environments { edges { node { id name } } } } }",
                        variables: { name: serviceName + "-proj" }
                    })
                });
                const projData = await projResp.json();
                projectId = projData?.data?.projectCreate?.id || "";
                envId = projData?.data?.projectCreate?.environments?.edges?.[0]?.node?.id || "";
                if (!projectId) {
                    return { ok: false, err: projData?.errors?.[0]?.message || "Gagal membuat project Railway." };
                }
            }

            const svcResp = await fetch(endpoint, {
                method: "POST",
                headers,
                body: JSON.stringify({
                    query: "mutation($projectId: String!, $name: String!, $image: String!) { serviceCreate(input: { projectId: $projectId, name: $name, source: { image: $image } }) { id name } }",
                    variables: { projectId, name: serviceName, image: dockerImage }
                })
            });
            const svcData = await svcResp.json();
            const serviceId = svcData?.data?.serviceCreate?.id || "";
            if (!serviceId) {
                return { ok: false, err: svcData?.errors?.[0]?.message || "Gagal membuat service VPS Railway." };
            }

            if (envId) {
                await fetch(endpoint, {
                    method: "POST",
                    headers,
                    body: JSON.stringify({
                        query: "mutation($projectId: String!, $environmentId: String!, $serviceId: String!, $variables: EnvironmentVariables!) { variableCollectionUpsert(input: { projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId, variables: $variables }) }",
                        variables: {
                            projectId,
                            environmentId: envId,
                            serviceId,
                            variables: { ROOT_PASSWORD: rootPass, DEBIAN_FRONTEND: "noninteractive" }
                        }
                    })
                });
            }

            return {
                ok: true,
                remote_id: serviceId,
                endpoint_info: "Project: " + projectId + " | Image: " + dockerImage
            };
        } catch (err) {
            return {
                ok: false,
                err: "Koneksi browser ke API Railway terblokir CORS / jaringan: " + err.message
            };
        }
    }

    async function createPterodactylServer(domain, apiKey, serverName, userId, eggId, nestId, locId, ramMb, diskMb, cpuPct) {
        let baseUrl = domain.trim().replace(/\/+$/, "");
        if (!/^https?:\/\//i.test(baseUrl)) baseUrl = "https://" + baseUrl;

        const headers = {
            "Authorization": "Bearer " + apiKey,
            "Accept": "application/json",
            "Content-Type": "application/json"
        };

        try {
            const eggResp = await fetch(baseUrl + "/api/application/nests/" + nestId + "/eggs/" + eggId, {
                method: "GET",
                headers
            });
            const eggData = await eggResp.json();
            if (!eggResp.ok || !eggData?.attributes) {
                const detail = eggData?.errors?.[0]?.detail || ("HTTP " + eggResp.status);
                return { ok: false, err: "Gagal mengambil Egg Pterodactyl: " + detail };
            }

            const eggAttr = eggData.attributes;
            const payload = {
                name: serverName,
                user: Math.max(1, parseInt(userId, 10) || 1),
                egg: Math.max(1, parseInt(eggId, 10) || 15),
                docker_image: eggAttr.docker_image || "ghcr.io/pterodactyl/yolks:java_17",
                startup: eggAttr.startup || "java -Xms128M -Xmx{{SERVER_MEMORY}}M -jar {{SERVER_JARFILE}}",
                environment: {
                    SERVER_JARFILE: "server.jar",
                    VANILLA_VERSION: "latest",
                    MINECRAFT_VERSION: "latest",
                    BUILD_NUMBER: "latest"
                },
                limits: {
                    memory: Math.max(128, parseInt(ramMb, 10) || 1024),
                    swap: 0,
                    disk: Math.max(256, parseInt(diskMb, 10) || 2048),
                    io: 500,
                    cpu: Math.max(10, parseInt(cpuPct, 10) || 100)
                },
                feature_limits: { databases: 1, backups: 1, allocations: 1 },
                deploy: {
                    locations: [Math.max(1, parseInt(locId, 10) || 1)],
                    dedicated_ip: false,
                    port_range: []
                }
            };

            const srvResp = await fetch(baseUrl + "/api/application/servers", {
                method: "POST",
                headers,
                body: JSON.stringify(payload)
            });
            const srvData = await srvResp.json();
            if (srvResp.status === 201 && srvData?.attributes?.identifier) {
                const attr = srvData.attributes;
                return {
                    ok: true,
                    remote_id: attr.identifier + " (ID #" + attr.id + ")",
                    endpoint_info: baseUrl + " | RAM " + ramMb + "MB / Disk " + diskMb + "MB"
                };
            }
            const errDetail = srvData?.errors?.[0]?.detail || ("HTTP " + srvResp.status);
            return { ok: false, err: "Pterodactyl menolak pembuatan server: " + errDetail };
        } catch (err) {
            return {
                ok: false,
                err: "Gagal menghubungi domain Pterodactyl (pastikan CORS / HTTPS panel aktif): " + err.message
            };
        }
    }

    // =========================================================================
    // 4. HELPER FORMATTER & PERHITUNGAN SALDO
    // =========================================================================
    function esc(str) {
        return String(str ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function idr(val) {
        const num = Math.round(Number(val) || 0);
        return "Rp " + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function parseNum(str) {
        return parseInt(String(str || "").replace(/[^0-9]/g, ""), 10) || 0;
    }

    function namaHari(dateStr) {
        if (!dateStr) return "";
        const p = dateStr.split("-");
        if (p.length !== 3) return "";
        const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        return hari[d.getDay()] || "";
    }

    function fmtDateFull(dateStr) {
        if (!dateStr) return "-";
        const p = dateStr.split("-");
        if (p.length !== 3) return dateStr;
        const bln = ["", "Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
        return namaHari(dateStr) + ", " + parseInt(p[2], 10) + " " + bln[parseInt(p[1], 10)] + " " + p[0];
    }

    function computeAccountStats() {
        let grandBalance = 0, grandIn = 0, grandOut = 0;
        const accMap = {};
        const enriched = STATE.accounts.map(a => {
            let totalIn = 0, totalOut = 0;
            for (const e of STATE.entries) {
                if (e.account_id === a.id) {
                    if (e.type === "in") totalIn += e.amount;
                    else totalOut += e.amount;
                }
            }
            const balance = totalIn - totalOut;
            grandIn += totalIn;
            grandOut += totalOut;
            grandBalance += balance;
            const obj = { ...a, total_in: totalIn, total_out: totalOut, balance };
            accMap[a.id] = obj;
            return obj;
        });
        return { accounts: enriched, accMap, grandBalance, grandIn, grandOut };
    }

    function setFlash(text, isErr = false) {
        FLASH_MSG = { text, isErr };
    }

    // =========================================================================
    // 5. EKSPOR CSV & BACKUP / RESTORE JSON LOCALSTORAGE
    // =========================================================================
    async function downloadCsv() {
        await writeAudit("DATA_EXPORT", "Ekspor laporan mutasi ke CSV");
        saveState();
        const { accMap } = computeAccountStats();
        const rows = [["No", "Hari", "Tanggal", "Jam", "Pos", "Jenis", "Kategori", "Keterangan", "Nominal"]];
        const sorted = [...STATE.entries].sort((a, b) => (b.entry_date + b.entry_time).localeCompare(a.entry_date + a.entry_time) || b.id - a.id);
        for (const r of sorted) {
            rows.push([
                r.ref,
                namaHari(r.entry_date),
                r.entry_date,
                r.entry_time,
                accMap[r.account_id]?.name || "Pos",
                r.type === "in" ? "MASUK" : "KELUAR",
                r.category,
                '"' + String(r.note).replace(/"/g, '""') + '"',
                r.amount
            ]);
        }
        const csvContent = rows.map(r => r.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "mutasi_" + getNowParts(STATE.meta.timezone).date.replace(/-/g, "") + ".csv";
        a.click();
        URL.revokeObjectURL(url);
        renderApp();
    }

    function exportJsonBackup() {
        const payload = {
            version: "v6-ghpages",
            exported_at: new Date().toISOString(),
            master_key_hex: localStorage.getItem(MASTER_KEY_STORAGE),
            vault_data: STATE
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "backup_vault_" + getNowParts(STATE.meta.timezone).date + ".json";
        a.click();
        URL.revokeObjectURL(url);
        setFlash("File backup JSON terenkripsi berhasil diunduh.");
        renderApp();
    }

    // =========================================================================
    async function renderApp() {
        const root = document.getElementById("app-viewport");
        if (!root) return;

        const nowParts = getNowParts(STATE.meta.timezone);
        const hariIni = nowParts.date;
        const bulanIni = hariIni.slice(0, 7);

        const { accounts, accMap, grandBalance, grandIn, grandOut } = computeAccountStats();

        let masukBulanIni = 0, keluarBulanIni = 0, masukHariIni = 0, keluarHariIni = 0;
        for (const e of STATE.entries) {
            if (e.entry_date.startsWith(bulanIni)) {
                if (e.type === "in") masukBulanIni += e.amount;
                else keluarBulanIni += e.amount;
            }
            if (e.entry_date === hariIni) {
                if (e.type === "in") masukHariIni += e.amount;
                else keluarHariIni += e.amount;
            }
        }

        // Hitung countdown hari gajian
        const [yStr, mStr] = hariIni.split("-");
        let yTarget = parseInt(yStr, 10);
        let mTarget = parseInt(mStr, 10);
        let maxDay = new Date(yTarget, mTarget, 0).getDate();
        let targetGajiStr = `${yTarget}-${String(mTarget).padStart(2, "0")}-${String(Math.min(STATE.meta.payday_day, maxDay)).padStart(2, "0")}`;

        if (targetGajiStr < hariIni) {
            mTarget += 1;
            if (mTarget > 12) { mTarget = 1; yTarget += 1; }
            maxDay = new Date(yTarget, mTarget, 0).getDate();
            targetGajiStr = `${yTarget}-${String(mTarget).padStart(2, "0")}-${String(Math.min(STATE.meta.payday_day, maxDay)).padStart(2, "0")}`;
        }
        const selisihHariGaji = Math.round((new Date(targetGajiStr + "T00:00:00") - new Date(hariIni + "T00:00:00")) / 86400000);

        // Verifikasi Integritas Mutasi
        let tamperedCount = 0;
        const sortedEntries = [...STATE.entries].sort((a, b) => (b.entry_date + b.entry_time).localeCompare(a.entry_date + a.entry_time) || b.id - a.id);
        const showRunning = (FILTER.acc === 0 && FILTER.type === "all" && FILTER.month === "" && FILTER.q === "");
        let running = grandBalance;

        const displayEntries = [];
        for (const rawE of sortedEntries) {
            const e = { ...rawE };
            const expectedSig = await signEntryObj(e);
            e.is_valid = (expectedSig === e.integrity_sig);
            if (!e.is_valid) tamperedCount++;

            if (showRunning) {
                e.running_balance = running;
                running += (e.type === "in") ? -e.amount : e.amount;
            }

            if (FILTER.acc > 0 && e.account_id !== FILTER.acc) continue;
            if ((FILTER.type === "in" || FILTER.type === "out") && e.type !== FILTER.type) continue;
            if (FILTER.month && !e.entry_date.startsWith(FILTER.month)) continue;
            if (FILTER.q) {
                const qLow = FILTER.q.toLowerCase();
                const match = e.note.toLowerCase().includes(qLow) || e.category.toLowerCase().includes(qLow) || e.ref.toLowerCase().includes(qLow);
                if (!match) continue;
            }
            displayEntries.push(e);
        }

        // Verifikasi Rantai Audit Log
        let prevChain = "0".repeat(64);
        let chainBroken = false;
        const verifiedLogs = [];
        for (const al of STATE.audit_logs) {
            const calc = await hmacSha256([prevChain, al.event_time, al.ip_addr, al.action_code, al.detail].join("|"));
            const valid = (calc === al.chain_hash);
            if (!valid) chainBroken = true;
            prevChain = al.chain_hash;
            verifiedLogs.push({ ...al, valid });
        }
        const auditLogsDesc = verifiedLogs.reverse();

        // Unseal mask profil cloud
        const profilesView = [];
        for (const cp of STATE.cloud_profiles) {
            const rwPlain = await unsealSecret(cp.rw_token_enc);

        const deploymentsView = [];
        for (const cd of STATE.cloud_deployments) {

            deploymentsView.push({

        }

    // =========================================================================
    // 7. EVENT BINDINGS & AKSI PENGGUNA
    // =========================================================================
    function bindEvents() {
        const root = document.getElementById("app-viewport");

        // Navigasi Tab
        root.querySelectorAll("[data-nav]").forEach(btn => {
            btn.addEventListener("click", () => {
                CURRENT_VIEW = btn.getAttribute("data-nav");
                FLASH_MSG = null;
                renderApp();
            });
        });

        // Tutup Flash
        const closeFlash = document.getElementById("btn-close-flash");
        if (closeFlash) {
            closeFlash.addEventListener("click", () => {
                FLASH_MSG = null;
                renderApp();
            });
        }

        // Format Angka Ribuan Otomatis
        root.querySelectorAll('input[data-fmt="num"]').forEach(el => {
            el.addEventListener("input", () => {
                const v = el.value.replace(/[^0-9]/g, "");
                el.value = v ? v.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : "";
            });
        });

        // Unduh CSV
        const btnCsv = document.getElementById("btn-export-csv");
        if (btnCsv) btnCsv.addEventListener("click", downloadCsv);

        // Tambah Transaksi Kas
        const frmEntry = document.getElementById("form-add-entry");
        if (frmEntry) {
            frmEntry.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmEntry);
                const accId = parseInt(fd.get("account_id"), 10);
                const type = fd.get("type") === "out" ? "out" : "in";
                const amt = parseNum(fd.get("amount"));
                const cat = (fd.get("category") || "Umum").trim().slice(0, 40);
                const note = (fd.get("note") || "").trim().slice(0, 200);
                const date = fd.get("entry_date");
                const time = fd.get("entry_time");

                if (accId > 0 && amt > 0 && note) {
                    const { accMap } = computeAccountStats();
                    const bal = accMap[accId]?.balance || 0;
                    if (type === "out" && amt > bal) {
                        setFlash("Penarikan ditolak: Saldo pos hanya " + idr(bal) + ".", true);
                        renderApp();
                        return;
                    }
                    const nextId = STATE.entries.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                    const ref = String(nextId).padStart(4, "0");
                    const entry = { id: nextId, account_id: accId, ref, type, category: cat, amount: amt, note, entry_date: date, entry_time: time };
                    entry.integrity_sig = await signEntryObj(entry);
                    STATE.entries.push(entry);
                    await writeAudit("ENTRY_ADD", `Ref #${ref} (${type}) Rp ${amt} pada ${date} ${time}`);
                    saveState();
                    setFlash(`Transaksi #${ref} tersimpan ke localStorage.`);
                    renderApp();
                }
            });
        }

        // Catat Cepat Gaji
        const frmPayday = document.getElementById("form-quick-payday");
        if (frmPayday) {
            frmPayday.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmPayday);
                const accId = parseInt(fd.get("account_id"), 10);
                const amt = parseNum(fd.get("amount"));
                const note = (fd.get("note") || STATE.meta.payday_label).trim().slice(0, 200);
                const np = getNowParts(STATE.meta.timezone);

                if (accId > 0 && amt > 0) {
                    const nextId = STATE.entries.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                    const ref = String(nextId).padStart(4, "0");
                    const entry = { id: nextId, account_id: accId, ref, type: "in", category: "Gaji", amount: amt, note, entry_date: np.date, entry_time: np.time };
                    entry.integrity_sig = await signEntryObj(entry);
                    STATE.entries.push(entry);
                    await writeAudit("PAYDAY_IN", `Setoran Gaji Ref #${ref} Rp ${amt}`);
                    saveState();
                    setFlash(`Setoran gaji #${ref} sebesar ${idr(amt)} berhasil dicatat.`);
                    renderApp();
                }
            });
        }

        // Hapus Transaksi
        root.querySelectorAll("[data-del-entry]").forEach(btn => {
            btn.addEventListener("click", async () => {
                if (!confirm("Hapus baris mutasi ini?")) return;
                const id = parseInt(btn.getAttribute("data-del-entry"), 10);
                const idx = STATE.entries.findIndex(x => x.id === id);
                if (idx !== -1) {
                    const row = STATE.entries[idx];
                    STATE.entries.splice(idx, 1);
                    await writeAudit("ENTRY_DEL", `Menghapus Ref #${row.ref} (${row.type}) Rp ${row.amount}`);
                    saveState();
                    setFlash(`Baris transaksi #${row.ref} dihapus.`);
                    renderApp();
                }
            });
        });

        // Filter Mutasi
        const frmFilter = document.getElementById("form-filter");
        if (frmFilter) {
            frmFilter.addEventListener("submit", e => {
                e.preventDefault();
                const fd = new FormData(frmFilter);
                FILTER.acc = parseInt(fd.get("acc"), 10) || 0;
                FILTER.type = fd.get("type") || "all";
                FILTER.month = fd.get("month") || "";
                FILTER.q = (fd.get("q") || "").trim();
                renderApp();
            });
        }
        const btnResetFilter = document.getElementById("btn-reset-filter");
        if (btnResetFilter) {
            btnResetFilter.addEventListener("click", () => {
                FILTER = { acc: 0, type: "all", month: "", q: "" };
                renderApp();
            });
        }

        // Tambah Profil Cloud
        const frmAddCloud = document.getElementById("form-add-cloud-profile");
        if (frmAddCloud) {
            frmAddCloud.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmAddCloud);
                const label = (fd.get("label") || "").trim().slice(0, 60);
                if (!label) return;
                const nextId = STATE.cloud_profiles.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                STATE.cloud_profiles.push({
                    id: nextId,
                    label,
                    rw_token_enc: await sealSecret((fd.get("rw_token") || "").trim()),
                    rw_project_id: (fd.get("rw_project_id") || "").trim(),
                    rw_env_id: (fd.get("rw_env_id") || "").trim(),
                    ptero_domain: (fd.get("ptero_domain") || "").trim(),
                    ptero_apikey_enc: await sealSecret((fd.get("ptero_apikey") || "").trim()),
                    ptero_nest_id: Math.max(1, parseInt(fd.get("ptero_nest_id"), 10) || 1),
                    ptero_egg_id: Math.max(1, parseInt(fd.get("ptero_egg_id"), 10) || 15),
                    ptero_location_id: Math.max(1, parseInt(fd.get("ptero_location_id"), 10) || 1)
                });
                await writeAudit("CLOUD_PROF_ADD", `Menyimpan profil kredensial terenkripsi: ${label}`);
                saveState();
                setFlash(`Profil '${label}' disimpan dengan enkripsi AES-256-GCM.`);
                renderApp();
            });
        }

        // Edit Profil Cloud
        root.querySelectorAll(".form-edit-cloud-profile").forEach(frm => {
            frm.addEventListener("submit", async e => {
                e.preventDefault();
                const id = parseInt(frm.getAttribute("data-profile-id"), 10);
                const prof = STATE.cloud_profiles.find(p => p.id === id);
                if (!prof) return;
                const fd = new FormData(frm);
                const newLabel = (fd.get("label") || "").trim().slice(0, 60);
                if (newLabel) prof.label = newLabel;
                const newRw = (fd.get("rw_token") || "").trim();
                if (newRw) prof.rw_token_enc = await sealSecret(newRw);
                prof.rw_project_id = (fd.get("rw_project_id") || "").trim();
                prof.rw_env_id = (fd.get("rw_env_id") || "").trim();
                prof.ptero_domain = (fd.get("ptero_domain") || "").trim();
                const newPt = (fd.get("ptero_apikey") || "").trim();
                if (newPt) prof.ptero_apikey_enc = await sealSecret(newPt);
                prof.ptero_nest_id = Math.max(1, parseInt(fd.get("ptero_nest_id"), 10) || 1);
                prof.ptero_egg_id = Math.max(1, parseInt(fd.get("ptero_egg_id"), 10) || 15);
                prof.ptero_location_id = Math.max(1, parseInt(fd.get("ptero_location_id"), 10) || 1);

                await writeAudit("CLOUD_PROF_UPD", `Memperbarui profil kredensial: ${prof.label}`);
                saveState();
                setFlash(`Profil '${prof.label}' diperbarui.`);
                renderApp();
            });
        });

        // Hapus Profil Cloud
        root.querySelectorAll("[data-del-profile]").forEach(btn => {
            btn.addEventListener("click", async () => {
                if (!confirm("Hapus profil kredensial ini?")) return;
                const id = parseInt(btn.getAttribute("data-del-profile"), 10);
                const idx = STATE.cloud_profiles.findIndex(p => p.id === id);
                if (idx !== -1) {
                    const name = STATE.cloud_profiles[idx].label;
                    STATE.cloud_profiles.splice(idx, 1);
                    await writeAudit("CLOUD_PROF_DEL", `Menghapus profil kredensial: ${name}`);
                    saveState();
                    setFlash(`Profil '${name}' dihapus.`);
                    renderApp();
                }
            });
        });

        // Deploy VPS Railway
        const frmDeployRw = document.getElementById("form-deploy-railway");
        if (frmDeployRw) {
            frmDeployRw.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmDeployRw);
                const profId = parseInt(fd.get("profile_id"), 10);
                const prof = STATE.cloud_profiles.find(p => p.id === profId);
                if (!prof || !prof.rw_token_enc) {
                    setFlash("Token Railway pada profil terpilih belum diatur.", true);
                    renderApp();
                    return;
                }
                const svcName = (fd.get("service_name") || "ubuntu-vps").trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
                const image = fd.get("docker_image") || "ubuntu:24.04";
                let rootPass = (fd.get("root_pass") || "").replace(/[^a-zA-Z0-9]/g, "").slice(0, 6);
                if (rootPass.length < 6) {
                    rootPass = bytesToHex(crypto.getRandomValues(new Uint8Array(3))).slice(0, 6);
                }

                const btn = document.getElementById("btn-submit-rw");
                btn.disabled = true;
                btn.textContent = "Menghubungi API Railway...";

                const token = await unsealSecret(prof.rw_token_enc);
                const res = await deployRailwayVps(token, prof.rw_project_id, prof.rw_env_id, svcName, image, rootPass);

                if (res.ok) {
                    const nextId = STATE.cloud_deployments.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                    const np = getNowParts(STATE.meta.timezone);
                    STATE.cloud_deployments.unshift({
                        id: nextId,
                        profile_id: profId,
                        provider: "RAILWAY_VPS",
                        instance_name: svcName,
                        remote_id: res.remote_id,
                        endpoint_info: res.endpoint_info,
                        root_pass_enc: await sealSecret(rootPass),
                        created_at: np.date + " " + np.time
                    });
                    await writeAudit("RW_VPS_CREATE", `Deploy Railway VPS '${svcName}' (${prof.label})`);
                    saveState();
                    setFlash(`VPS Railway '${svcName}' berhasil dibuat (ID: ${res.remote_id}).`);
                } else {
                    await writeAudit("RW_VPS_ERR", res.err);
                    saveState();
                    setFlash(res.err, true);
                }
                renderApp();
            });
        }

        // Buat Server Pterodactyl
        const frmCreatePtero = document.getElementById("form-create-ptero");
        if (frmCreatePtero) {
            frmCreatePtero.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmCreatePtero);
                const profId = parseInt(fd.get("profile_id"), 10);
                const prof = STATE.cloud_profiles.find(p => p.id === profId);
                if (!prof || !prof.ptero_domain || !prof.ptero_apikey_enc) {
                    setFlash("Domain atau API Key Pterodactyl pada profil terpilih belum diatur.", true);
                    renderApp();
                    return;
                }
                const srvName = (fd.get("server_name") || "Server-Panel").trim().slice(0, 50);
                const userId = fd.get("ptero_user_id");
                const ramMb = fd.get("ram_mb");
                const diskMb = fd.get("disk_mb");
                const cpuPct = fd.get("cpu_pct");

                const btn = document.getElementById("btn-submit-ptero");
                btn.disabled = true;
                btn.textContent = "Membuat Server Panel...";

                const apiKey = await unsealSecret(prof.ptero_apikey_enc);
                const res = await createPterodactylServer(
                    prof.ptero_domain, apiKey, srvName, userId,
                    prof.ptero_egg_id, prof.ptero_nest_id, prof.ptero_location_id,
                    ramMb, diskMb, cpuPct
                );

                if (res.ok) {
                    const nextId = STATE.cloud_deployments.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                    const np = getNowParts(STATE.meta.timezone);
                    STATE.cloud_deployments.unshift({
                        id: nextId,
                        profile_id: profId,
                        provider: "PTERODACTYL",
                        instance_name: srvName,
                        remote_id: res.remote_id,
                        endpoint_info: res.endpoint_info,
                        root_pass_enc: "",
                        created_at: np.date + " " + np.time
                    });
                    await writeAudit("PTERO_CREATE", `Membuat Panel Pterodactyl '${srvName}' (${prof.label})`);
                    saveState();
                    setFlash(`Server Pterodactyl '${srvName}' berhasil dibuat (${res.remote_id}).`);
                } else {
                    await writeAudit("PTERO_ERR", res.err);
                    saveState();
                    setFlash(res.err, true);
                }
                renderApp();
            });
        }

        // Hapus Riwayat Deploy
        root.querySelectorAll("[data-del-deploy]").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = parseInt(btn.getAttribute("data-del-deploy"), 10);
                STATE.cloud_deployments = STATE.cloud_deployments.filter(d => d.id !== id);
                saveState();
                setFlash("Riwayat instance dihapus.");
                renderApp();
            });
        });

        // Pos Simpanan: Tambah, Edit, Hapus, Transfer
        const frmAddAcc = document.getElementById("form-add-acc");
        if (frmAddAcc) {
            frmAddAcc.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmAddAcc);
                const name = (fd.get("name") || "").trim().slice(0, 60);
                if (!name) return;
                const nextId = STATE.accounts.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                const code = "ACC-" + String(nextId).padStart(2, "0");
                STATE.accounts.push({
                    id: nextId,
                    code,
                    name,
                    goal: parseNum(fd.get("goal")),
                    deadline: fd.get("deadline") || ""
                });
                await writeAudit("ACC_CREATE", `Membuat pos simpanan ${code} (${name})`);
                saveState();
                setFlash("Pos simpanan ditambahkan.");
                renderApp();
            });
        }

        root.querySelectorAll(".form-edit-acc").forEach(frm => {
            frm.addEventListener("submit", async e => {
                e.preventDefault();
                const id = parseInt(frm.getAttribute("data-acc-id"), 10);
                const acc = STATE.accounts.find(a => a.id === id);
                if (!acc) return;
                const fd = new FormData(frm);
                acc.name = (fd.get("name") || acc.name).trim().slice(0, 60);
                acc.goal = parseNum(fd.get("goal"));
                acc.deadline = fd.get("deadline") || "";
                await writeAudit("ACC_EDIT", `Memperbarui pos ${acc.code} (${acc.name})`);
                saveState();
                setFlash("Pos simpanan diperbarui.");
                renderApp();
            });
        });

        root.querySelectorAll("[data-del-acc]").forEach(btn => {
            btn.addEventListener("click", async () => {
                if (STATE.accounts.length <= 1) {
                    setFlash("Tidak dapat menghapus pos terakhir.", true);
                    renderApp();
                    return;
                }
                if (!confirm("Hapus pos ini beserta seluruh mutasinya?")) return;
                const id = parseInt(btn.getAttribute("data-del-acc"), 10);
                const acc = STATE.accounts.find(a => a.id === id);
                STATE.accounts = STATE.accounts.filter(a => a.id !== id);
                STATE.entries = STATE.entries.filter(e => e.account_id !== id);
                await writeAudit("ACC_DELETE", `Menghapus pos ${acc?.name || id}`);
                saveState();
                setFlash("Pos simpanan dihapus.");
                renderApp();
            });
        });

        const frmTransfer = document.getElementById("form-transfer");
        if (frmTransfer) {
            frmTransfer.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmTransfer);
                const fromId = parseInt(fd.get("from_id"), 10);
                const toId = parseInt(fd.get("to_id"), 10);
                const amt = parseNum(fd.get("amount"));
                const date = fd.get("entry_date");
                const time = fd.get("entry_time");

                if (fromId === toId || amt <= 0) return;
                const { accMap } = computeAccountStats();
                if (amt > (accMap[fromId]?.balance || 0)) {
                    setFlash("Saldo pos asal tidak mencukupi.", true);
                    renderApp();
                    return;
                }

                const nextId = STATE.entries.reduce((m, x) => Math.max(m, x.id), 0) + 1;
                const ref = String(nextId).padStart(4, "0");
                const fromName = accMap[fromId].name;
                const toName = accMap[toId].name;

                const eOut = { id: nextId, account_id: fromId, ref, type: "out", category: "Transfer", amount: amt, note: "Pindah ke " + toName, entry_date: date, entry_time: time };
                eOut.integrity_sig = await signEntryObj(eOut);

                const eIn = { id: nextId + 1, account_id: toId, ref, type: "in", category: "Transfer", amount: amt, note: "Terima dari " + fromName, entry_date: date, entry_time: time };
                eIn.integrity_sig = await signEntryObj(eIn);

                STATE.entries.push(eOut, eIn);
                await writeAudit("TRANSFER", `Ref #${ref} Rp ${amt} dari ${fromName} ke ${toName}`);
                saveState();
                setFlash(`Pemindahan dana #${ref} selesai.`);
                renderApp();
            });
        }

        // Pengaturan & Backup JSON
        const frmSettings = document.getElementById("form-save-settings");
        if (frmSettings) {
            frmSettings.addEventListener("submit", async e => {
                e.preventDefault();
                const fd = new FormData(frmSettings);
                STATE.meta.title = (fd.get("title") || "Buku Kas & Cloud Manager").trim().slice(0, 80);
                STATE.meta.timezone = fd.get("timezone") || "Asia/Jakarta";
                STATE.meta.payday_label = (fd.get("payday_label") || "Hari Gajian Bulanan").trim().slice(0, 50);
                STATE.meta.payday_day = Math.max(1, Math.min(31, parseInt(fd.get("payday_day"), 10) || 25));
                STATE.meta.payday_amount = parseNum(fd.get("payday_amount"));
                document.title = STATE.meta.title;
                await writeAudit("SYS_CONFIG", "Pengaturan jadwal gaji, zona waktu & judul diperbarui");
                saveState();
                setFlash("Pengaturan berhasil disimpan.");
                renderApp();
            });
        }

        const btnBackup = document.getElementById("btn-backup-json");
        if (btnBackup) btnBackup.addEventListener("click", exportJsonBackup);

        const btnRestore = document.getElementById("btn-restore-json");
        if (btnRestore) {
            btnRestore.addEventListener("click", () => {
                const fileInput = document.getElementById("input-restore-json");
                const file = fileInput?.files?.[0];
                if (!file) {
                    setFlash("Pilih file backup .JSON terlebih dahulu.", true);
                    renderApp();
                    return;
                }
                const reader = new FileReader();
                reader.onload = async ev => {
                    try {
                        const obj = JSON.parse(ev.target.result);
                        if (!obj?.vault_data?.meta || !obj?.master_key_hex) {
                            throw new Error("Format file backup tidak valid.");
                        }
                        localStorage.setItem(MASTER_KEY_STORAGE, obj.master_key_hex);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(obj.vault_data));
                        await loadState();
                        setFlash("Database berhasil dipulihkan dari file backup.");
                        renderApp();
                    } catch (err) {
                        setFlash("Gagal memulihkan backup: " + err.message, true);
                        renderApp();
                    }
                };
                reader.readAsText(file);
            });
        }
    }

    // =========================================================================
    // 8. BOOTSTRAP APLIKASI
    // =========================================================================
    async function boot() {
        await loadState();
        document.title = STATE.meta.title;
        setTimeout(renderApp, 220);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
})();
</script>
</body>
</html>
